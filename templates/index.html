<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- W3CSS -->
    <link rel="stylesheet"
          href="https://www.w3schools.com/w3css/5/w3.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <title>Prefect Voting System</title>

    <style>
        body {
            font-family: 'Public Sans', sans-serif;
        }
    </style>
</head>

<body class="w3-light-grey">

<div class="w3-container w3-center w3-padding-64">

    <h1 class="w3-xxxlarge">
        Burnside High School Prefect Voting
    </h1>

    <p class="w3-large">
        Secure Student Election Platform
    </p>

    <hr style="width:60%; margin:auto">

    <h3 class="w3-margin-top">Registered Users (Database Test)</h3>

    {% if user %}
        <p>Logged in as {{ user }}</p>
        <a href="/dashboard">Dashboard</a>
    {% else %}
        <a href="/login_page" class="w3-button w3-blue">
            Login with Google
        </a>
    {% endif %}
</div>

</body>
</html>
